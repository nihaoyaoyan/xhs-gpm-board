services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xhs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xhs_pass}
      POSTGRES_DB: ${POSTGRES_DB:-xhs_insight}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xhs} -d ${POSTGRES_DB:-xhs_insight}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-xhs}:${POSTGRES_PASSWORD:-xhs_pass}@db:5432/${POSTGRES_DB:-xhs_insight}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  mcp:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    command: ["python", "-m", "mcp_server.server"]
    working_dir: /app
    env_file:
      - .env
    environment:
      BACKEND_BASE_URL: http://api:8000
      MCP_API_TOKEN: ${MCP_API_TOKEN:-dev-service-token}
      MCP_TRANSPORT: streamable-http
      FASTMCP_HOST: 0.0.0.0
      FASTMCP_PORT: "9000"
      FASTMCP_STATELESS_HTTP: "true"
    ports:
      - "${MCP_PORT:-9000}:9000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket;socket.create_connection(('localhost',9000),3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mcp-chengfeng:
    build: ./mcp_server/servers/xhs-chengfeng-mapi-mcp
    volumes:
      - ./mcp_server/servers/xhs-chengfeng-mapi-mcp/.env:/app/.env:ro
    ports:
      - "${MCP_CHENGFENG_PORT:-9101}:9101"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket;socket.create_connection(('localhost',9101),3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  mcp-juguang:
    build: ./mcp_server/servers/xhs-juguang-mcp
    volumes:
      - ./mcp_server/servers/xhs-juguang-mcp/.env:/app/.env:ro
    ports:
      - "${MCP_JUGUANG_PORT:-9102}:9102"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket;socket.create_connection(('localhost',9102),3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
